<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>capture-to-vault</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --line: #2c3038; --text: #e8e6e1; --dim: #9a9ca3;
    --accent: #8b7cf6; --ok: #4fbf8a; --warn: #e6b04a; --err: #e5675f; --info: #6aa7e8;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 64px; }
  h1 { font-size: 20px; margin: 4px 0 2px; letter-spacing: .2px; }
  .sub { color: var(--dim); font-size: 14px; margin: 0 0 18px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 64px;
         border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
         color: var(--text); font: 600 16px/1 inherit; cursor: pointer; padding: 0 12px; }
  .btn.primary { grid-column: 1 / -1; min-height: 88px; font-size: 19px;
                 background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.rec { color: var(--err); }
  .btn.rec.on { background: var(--err); color: #fff; border-color: var(--err); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .75; } }
  .btn:disabled { opacity: .5; }
  input[type=file] { display: none; }
  .opts { display: flex; align-items: center; gap: 8px; margin: 14px 2px 0; color: var(--dim); font-size: 14px; }
  .opts input { width: 18px; height: 18px; accent-color: var(--accent); }

  #steps { list-style: none; padding: 0; margin: 22px 0 0; }
  .step { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; padding: 10px 0;
          border-top: 1px solid var(--line); align-items: start; }
  .dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 6px; background: var(--dim); }
  .start .dot { background: var(--info); animation: pulse 1s infinite; }
  .done .dot { background: var(--ok); } .warn .dot { background: var(--warn); }
  .error .dot { background: var(--err); } .info .dot { background: transparent; border: 2px solid var(--dim); }
  .role { font-weight: 600; } .role small { color: var(--dim); font-weight: 400; margin-left: 6px; }
  .txt { color: var(--dim); font-size: 14px; word-break: break-word; white-space: pre-wrap; }
  .t { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 3px; }
  .sublog { grid-column: 2 / -1; margin: 4px 0 0; padding: 8px 10px; background: #0f1114;
            border-radius: 8px; font: 12px/1.45 ui-monospace, Menlo, monospace; color: #b9bcc4;
            max-height: 220px; overflow: auto; white-space: pre-wrap; display: none; }
  .sublog.has { display: block; }

  #note { margin-top: 24px; display: none; background: var(--panel); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 18px 16px; }
  #note .path { color: var(--dim); font-size: 13px; }
  #note h2.title { margin: 4px 0 10px; font-size: 22px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: #262a31; color: var(--dim); }
  .chip b { color: var(--text); font-weight: 600; }
  #note .body h1, #note .body h2, #note .body h3 { font-size: 17px; margin: 16px 0 6px; }
  #note .body p { margin: 8px 0; }
  #note .body code { background: #0f1114; padding: 1px 5px; border-radius: 5px; font-size: 14px; }
  #note .body pre { background: #0f1114; padding: 10px; border-radius: 8px; overflow: auto; }
  a.wl { color: var(--accent); text-decoration: none; border-bottom: 1px dashed var(--accent); }
  .wl.broken { color: var(--err); border-bottom: 1px dashed var(--err); }
  .back { background: none; border: 0; color: var(--accent); font: inherit; padding: 0; cursor: pointer;
          margin-bottom: 8px; display: none; }
</style>
</head>
<body>
<main>
  <h1>capture-to-vault</h1>
  <p class="sub">Snap it, say it, drop it. It lands in the vault filed and linked.</p>

  <div class="actions">
    <button class="btn primary" id="snapBtn">Take photo</button>
    <button class="btn rec" id="recBtn">Record memo</button>
    <button class="btn" id="fileBtn">Upload file</button>
  </div>
  <input id="snap" type="file" accept="image/*" capture="environment">
  <input id="file" type="file" accept="image/*,audio/*,video/*,application/pdf,.heic,.m4a,.md,.txt">
  <input id="audio" type="file" accept="audio/*" capture>
  <label class="opts"><input type="checkbox" id="agent" checked> Managed Agent verifies fixes in a sandbox</label>

  <ul id="steps"></ul>

  <section id="note">
    <button class="back" id="back">&larr; back to the new note</button>
    <div class="path" id="notePath"></div>
    <h2 class="title" id="noteTitle"></h2>
    <div class="chips" id="noteChips"></div>
    <div class="body" id="noteBody"></div>
  </section>
</main>

<script>
const ROLES = {
  upload:     ["Upload", ""],
  transcribe: ["Transcriber", "gemini-4-hydrogen"],
  route:      ["Router", "gemini-decision-1"],
  manage:     ["Vault manager", "gemini-4-neon"],
  verify:     ["Checks", "python -m c2v.verify"],
  agent:      ["Verifier", "Managed Agent / Antigravity"],
  repair:     ["Vault manager", "gemini-4-neon repair"],
  write:      ["Filed", ""],
  result:     ["Done", ""],
  error:      ["Error", ""],
};
const $ = (id) => document.getElementById(id);
const stepsEl = $("steps");
let rows = {}, firstNote = null, busy = false;

function setBusy(b) {
  busy = b;
  for (const id of ["snapBtn", "fileBtn"]) $(id).disabled = b;
  if (!recording) $("recBtn").disabled = b;
}

function row(step) {
  if (rows[step]) return rows[step];
  const [role, model] = ROLES[step] || [step, ""];
  const li = document.createElement("li");
  li.className = "step start";
  li.innerHTML = `<span class="dot"></span><div><div class="role">${role}<small>${model}</small></div>
    <div class="txt"></div></div><span class="t"></span><pre class="sublog"></pre>`;
  stepsEl.appendChild(li);
  return (rows[step] = li);
}

function onStep(e) {
  const li = row(e.step);
  if (e.status === "info") {
    const log = li.querySelector(".sublog");
    log.textContent += e.text + "\n";
    log.classList.add("has");
    log.scrollTop = log.scrollHeight;
  } else {
    li.className = "step " + e.status;
    if (e.text) li.querySelector(".txt").textContent = e.text;
  }
  li.querySelector(".t").textContent = e.t.toFixed(1) + "s";
  if (e.step === "result") {
    li.querySelector(".txt").textContent =
      `path: ${e.text} · ${e.latency_s}s` + (e.written ? "" : " · not written");
    if (e.written) { firstNote = e.written; showNote({ path: e.written }); }
  }
}

async function upload(blob, name) {
  if (busy) return;
  stepsEl.innerHTML = ""; rows = {}; $("note").style.display = "none";
  setBusy(true);
  const fd = new FormData();
  fd.append("file", blob, name);
  fd.append("agent_verify", $("agent").checked ? "true" : "false");
  row("upload").querySelector(".txt").textContent = `uploading ${name}…`;
  try {
    const r = await fetch("/capture", { method: "POST", body: fd });
    if (!r.ok) throw new Error(`upload failed: ${r.status}`);
    const { job } = await r.json();
    const es = new EventSource(`/events/${job}`);
    es.addEventListener("step", (m) => onStep(JSON.parse(m.data)));
    es.addEventListener("end", () => { es.close(); setBusy(false); });
    es.onerror = () => { es.close(); setBusy(false); };
  } catch (err) {
    onStep({ step: "error", status: "error", text: String(err), t: 0 });
    setBusy(false);
  }
}

async function showNote(q) {
  const qs = new URLSearchParams(q).toString();
  const r = await fetch(`/note?${qs}`);
  if (!r.ok) return;
  const n = await r.json();
  $("note").style.display = "block";
  $("notePath").textContent = n.path;
  $("noteTitle").textContent = n.title;
  $("noteChips").innerHTML = Object.entries(n.frontmatter || {})
    .map(([k, v]) => `<span class="chip">${esc(k)}: <b>${esc(Array.isArray(v) ? v.join(", ") : v)}</b></span>`)
    .join("");
  $("noteBody").innerHTML = n.html;
  $("back").style.display = n.path === firstNote ? "none" : "block";
  $("note").scrollIntoView({ behavior: "smooth", block: "start" });
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

$("noteBody").addEventListener("click", (ev) => {
  const a = ev.target.closest("a.wl");
  if (!a) return;
  ev.preventDefault();
  showNote({ title: decodeURIComponent(a.dataset.title) });
});
$("back").onclick = () => showNote({ path: firstNote });

// --- photo / file ---
$("snapBtn").onclick = () => $("snap").click();
$("fileBtn").onclick = () => $("file").click();
for (const id of ["snap", "file", "audio"]) {
  $(id).onchange = (ev) => {
    const f = ev.target.files[0];
    if (f) upload(f, f.name);
    ev.target.value = "";
  };
}

// --- voice memo: MediaRecorder needs HTTPS or localhost; otherwise fall back to the native recorder ---
let recorder = null, chunks = [], recording = false;
const MIME = [["audio/mp4", "m4a"], ["audio/ogg;codecs=opus", "ogg"], ["audio/webm;codecs=opus", "webm"], ["audio/webm", "webm"]];
$("recBtn").onclick = async () => {
  if (!navigator.mediaDevices || !window.MediaRecorder) { $("audio").click(); return; }
  if (recording) { recorder.stop(); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { $("audio").click(); return; }
  const [mime, ext] = MIME.find(([m]) => MediaRecorder.isTypeSupported(m)) || ["", "webm"];
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
  chunks = [];
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    recording = false;
    $("recBtn").classList.remove("on"); $("recBtn").textContent = "Record memo";
    const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
    upload(new Blob(chunks, { type: recorder.mimeType }), `memo-${stamp}.${ext}`);
  };
  recorder.start();
  recording = true;
  $("recBtn").classList.add("on"); $("recBtn").textContent = "Stop and file";
};
</script>
</body>
</html>
